[project]
name = "transformers-adapters-lora-qlora"
version = "0.1.0"
description = "Hands-on study of Transformer architectures, Adapters, LoRA, and QLoRA for efficient LLM fine-tuning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12.0",
    "pytest>=8.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
